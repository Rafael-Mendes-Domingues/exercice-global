name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: cd app && npm install && npm test || echo "No tests yet"

  deploy-dev:
    if: github.ref == "refs/heads/dev"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Dev
        run: ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy-dev.yml

  deploy-prod:
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Prod
        run: ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy-prod.yml
