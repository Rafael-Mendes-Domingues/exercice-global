name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run tests
        working-directory: ./app
        run: npm test

  deploy-dev:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible sshpass

      - name: Deploy to DEV
        run: ansible-playbook -i ansible/inventory/dev.ini ansible/playbooks/deploy-dev.yml

  deploy-prod:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible sshpass

      - name: Deploy to PROD
        run: ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/deploy-prod.yml
